  <style>
    html,body{margin:0;min-height:100%;background:#ececec;color:#2b2b2b;font-family:"Lexend","Segoe UI",sans-serif;font-weight:300}
    main{max-width:560px;margin:0 auto;padding:18vh 24px 48px}
    .mark{display:flex;align-items:center;gap:10px;font-size:2rem;font-weight:200;margin-bottom:28px}
    .mark svg{width:44px;height:44px}
    h1{font-weight:200;font-size:1.7rem;margin:0 0 12px}

  </style>
</head>
<body>
  <main>
    <div class="mark"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="10" fill="none" stroke="currentColor" stroke-width="2"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M32 6v10M32 48v10M6 32h10M48 32h10M13 13l7 7M44 44l7 7M13 51l7-7M44 20l7-7"/></g></svg>bos</div>
    <h1>page not found / bladsy nie gevind nie</h1>
    <p>This address does not exist (any more). / Hierdie adres bestaan nie (meer) nie.</p>
    <a id="home" href="/">home / tuis</a>
  </main>
  <script>
    /* On username.github.io/repo/ the site root is the first folder, not "/". */
    (function () {
      var seg = location.pathname.split("/")[1];
      if (/\.github\.io$/.test(location.hostname) && seg) document.getElementById("home").href = "/" + seg + "/";
    })();
  </script>
